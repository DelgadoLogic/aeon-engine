<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230b0616' stroke='%2300D2FF' stroke-width='2.5'/><circle cx='16' cy='16' r='6' fill='%237C4DFF'/></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aeon Passwords Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-obsidian: #0b0616;
    --bg-surface: #0e071c;
    --bg-card: rgba(18, 20, 36, 0.65);
    --bg-card-hover: rgba(28, 21, 56, 0.95);
    --border-card: rgba(168, 85, 247, 0.18);
    --border-card-hover: rgba(192, 132, 252, 0.55);
    --border-glow: rgba(168, 85, 247, 0.35);
    --accent-purple: #9333ea;
    --accent-light: #c084fc;
    --accent-glow: rgba(147, 51, 234, 0.45);
    --neon-cyan: #38bdf8;
    --neon-cyan-glow: rgba(56, 189, 248, 0.35);
    --neon-pink: #ec4899;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f97316;
    --text-white: #f8fafc;
    --text-soft: #cbd5e1;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --radius: 14px;
    --radius-sm: 8px;
    --radius-lg: 18px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    background-color: #0b0616;
    overflow-x: hidden;
    color: var(--text-white);
    font-family: var(--font-main);
    min-height: 100vh;
    padding: 36px 48px 80px;
    background-image: 
      radial-gradient(ellipse 70% 55% at 50% 15%, rgba(112, 38, 206, 0.2) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 85% 80%, rgba(147, 51, 234, 0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 15% 90%, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
    background-attachment: fixed;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(192, 132, 252, 0.6); }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .page-icon-badge {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-purple), var(--neon-cyan));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(147, 51, 234, 0.45);
    cursor: pointer;
  }
  .page-icon-badge svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; }

  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-sub { font-size: 12px; color: var(--text-muted); }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 9px;
    font-family: var(--font-main);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s var(--ease);
    border: 1px solid transparent;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
    color: #fff;
    border-color: rgba(192, 132, 252, 0.4);
    box-shadow: 0 0 14px rgba(147, 51, 234, 0.35);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 20px rgba(192, 132, 252, 0.6);
  }
  .btn-ghost {
    background: var(--bg-card);
    border-color: var(--border-card);
    color: var(--text-soft);
  }
  .btn-ghost:hover {
    background: var(--bg-card-hover);
    color: var(--text-white);
    border-color: var(--border-card-hover);
  }

  /* Security Status Card */
  .security-banner {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .sec-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    backdrop-filter: blur(16px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .sec-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.35);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .sec-icon.purple {
    background: rgba(147, 51, 234, 0.15);
    border-color: rgba(168, 85, 247, 0.35);
    color: var(--accent-light);
  }
  .sec-icon.cyan {
    background: rgba(56, 189, 248, 0.15);
    border-color: rgba(56, 189, 248, 0.35);
    color: var(--neon-cyan);
  }
  .sec-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
  .sec-val { font-size: 17px; font-weight: 700; color: #fff; font-family: var(--font-mono); }
  .sec-lbl { font-size: 11.5px; color: var(--text-muted); }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
  }

  .search-box {
    flex: 1;
    max-width: 480px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    height: 42px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 9999px;
    padding: 0 16px 0 42px;
    color: var(--text-white);
    font-family: var(--font-main);
    font-size: 13.5px;
    outline: none;
    transition: all 0.2s var(--ease);
    backdrop-filter: blur(12px);
  }
  .search-box input:focus {
    border-color: var(--accent-light);
    box-shadow: 0 0 16px rgba(168, 85, 247, 0.35);
    background: rgba(28, 21, 56, 0.9);
  }
  .search-box svg {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    color: var(--accent-light);
    pointer-events: none;
  }

  /* Vault Table / Card */
  .vault-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    overflow: hidden;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  .vault-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(168, 85, 247, 0.1);
    transition: background 0.15s var(--ease);
  }
  .vault-row:last-child { border-bottom: none; }
  .vault-row:hover { background: rgba(168, 85, 247, 0.05); }

  .site-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(147, 51, 234, 0.2);
    border: 1px solid rgba(168, 85, 247, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-light);
    flex-shrink: 0;
  }
  .site-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

  .col-site { flex: 1.2; min-width: 160px; }
  .site-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 2px; }
  .site-url { font-size: 11.5px; font-family: var(--font-mono); color: var(--text-muted); }

  .col-user { flex: 1.2; min-width: 160px; display: flex; align-items: center; gap: 8px; }
  .user-text { font-size: 13px; color: var(--text-soft); font-family: var(--font-mono); }

  .col-pass { flex: 1.5; min-width: 200px; display: flex; align-items: center; gap: 10px; }
  .pass-text {
    font-size: 13px;
    font-family: var(--font-mono);
    color: var(--text-white);
    letter-spacing: 0.1em;
    min-width: 110px;
  }
  .pass-text.revealed { color: var(--neon-cyan); letter-spacing: 0.02em; font-weight: 600; }

  .badge-health {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .badge-health.strong { background: rgba(34, 197, 94, 0.15); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.35); }
  .badge-health.warning { background: rgba(249, 115, 22, 0.15); color: var(--orange); border: 1px solid rgba(249, 115, 22, 0.35); }

  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: rgba(18, 20, 36, 0.85);
    border: 1px solid var(--border-card);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s var(--ease);
  }
  .icon-btn:hover { color: #fff; border-color: var(--accent-light); background: rgba(147, 51, 234, 0.3); }
  .icon-btn.del:hover { color: var(--red); border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1); }
  .icon-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(18, 20, 36, 0.95);
    border: 1px solid var(--accent-light);
    border-radius: 12px;
    padding: 12px 20px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 20px rgba(147, 51, 234, 0.4);
    display: flex;
    align-items: center;
    gap: 10px;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s var(--ease);
    z-index: 100;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast svg { width: 18px; height: 18px; color: var(--green); flex-shrink: 0; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(8, 4, 16, 0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal-dialog {
    background: rgba(18, 20, 36, 0.95);
    border: 1px solid var(--border-card-hover);
    border-radius: var(--radius-lg);
    padding: 28px 32px;
    max-width: 480px;
    width: 90vw;
    box-shadow: 0 16px 48px rgba(0,0,0,0.8), 0 0 30px rgba(147, 51, 234, 0.35);
  }
  .modal-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .form-group input {
    width: 100%;
    height: 38px;
    background: rgba(14, 10, 28, 0.85);
    border: 1px solid var(--border-card);
    border-radius: 8px;
    color: var(--text-white);
    font-family: var(--font-main);
    font-size: 13px;
    padding: 0 12px;
    outline: none;
  }
  .form-group input:focus { border-color: var(--accent-light); box-shadow: 0 0 12px rgba(147, 51, 234, 0.35); }
  .pass-gen-box {
    background: rgba(14, 10, 28, 0.7);
    border: 1px solid var(--border-card);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 8px;
  }
  .gen-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .gen-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--text-soft); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* =========================================================================
     RESPONSIVE MEDIA QUERIES (<=900px and <=640px)
     ========================================================================= */
  @media (max-width: 900px) {
    body {
      padding: 24px 20px 60px;
    }
    .security-banner {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .header {
      flex-direction: row;
      gap: 12px;
    }
    .top-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .search-box {
      max-width: 100%;
    }
    .vault-row {
      gap: 12px;
      padding: 12px 16px;
      flex-wrap: wrap;
    }
    .col-site {
      flex: 1;
      min-width: 140px;
    }
    .col-user {
      flex: 1;
      min-width: 140px;
    }
    .col-pass {
      flex: 1.2;
      min-width: 160px;
    }
  }

  @media (max-width: 640px) {
    body {
      padding: 16px 12px 60px;
      overflow-x: hidden;
    }
    .header {
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
    }
    .header-actions {
      width: 100%;
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      flex-wrap: wrap;
    }
    .security-banner {
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .top-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .search-box {
      width: 100%;
      max-width: 100%;
    }
    .vault-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 14px;
      position: relative;
    }
    .site-icon {
      width: 32px;
      height: 32px;
    }
    .col-site, .col-user, .col-pass {
      width: 100%;
      min-width: 0;
      flex: none;
    }
    .col-user, .col-pass {
      justify-content: space-between;
    }
    .pass-text {
      word-break: break-all;
      min-width: 0;
      flex: 1;
    }
    .vault-row-actions {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-left: 0 !important;
      padding-top: 6px;
      border-top: 1px solid rgba(168, 85, 247, 0.1);
    }
    .modal-dialog {
      padding: 20px 16px;
      width: 95vw;
    }
    .gen-options {
      grid-template-columns: 1fr;
    }
    .toast {
      right: 12px;
      left: 12px;
      bottom: 12px;
      transform: translateY(120px);
    }
  }

</style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="page-icon-badge" onclick="location.href='aeon://newtab'">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div>
        <h1>Password Vault</h1>
        <div class="header-sub">Hardware-bound Windows DPAPI isolation • Zero plain-text on disk</div>
      </div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-ghost" onclick="exportVault()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Export CSV
      </button>
      <button class="btn btn-primary" onclick="openAddModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Credential
      </button>
    </div>
  </div>

  <!-- Security Banner -->
  <div class="security-banner">
    <div class="sec-card">
      <div class="sec-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div>
        <div class="sec-val">DPAPI Locked</div>
        <div class="sec-lbl">Cryptographic Isolation Active</div>
      </div>
    </div>

    <div class="sec-card">
      <div class="sec-icon purple">
        <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div>
        <div class="sec-val" id="audit-score">100% Secure</div>
        <div class="sec-lbl">0 Compromised • 0 Weak Passwords</div>
      </div>
    </div>

    <div class="sec-card">
      <div class="sec-icon cyan">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div>
        <div class="sec-val" id="auto-lock-val">10s Auto-Hide</div>
        <div class="sec-lbl">Ephemeral Plaintext In-Memory</div>
      </div>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="vault-search" name="vault_search" aria-label="Search saved accounts or URLs" placeholder="Search saved accounts or URLs..." oninput="onSearch()">
    </div>
  </div>

  <!-- Vault Card Table -->
  <div class="vault-card" id="vault-container">
    <!-- Populated dynamically -->
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toast-msg">Copied to clipboard</span>
  </div>

  <!-- Add/Edit Credential Modal -->
  <div class="modal-backdrop" id="cred-modal">
    <div class="modal-dialog">
      <div class="modal-title" id="cred-modal-title">Add Credential</div>
      <div class="form-group">
        <label for="cred-input-origin">Website / Origin URL</label>
        <input type="text" id="cred-input-origin" aria-label="Website / Origin URL" placeholder="https://example.com">
      </div>
      <div class="form-group">
        <label for="cred-input-user">Username / Email</label>
        <input type="text" id="cred-input-user" aria-label="Username / Email" placeholder="username or user@domain.com">
      </div>
      <div class="form-group">
        <label for="cred-input-pass">Password</label>
        <input type="password" id="cred-input-pass" aria-label="Password" placeholder="••••••••••••">
      </div>

      <!-- Password Generator -->
      <div class="pass-gen-box">
        <div class="gen-header">
          <span style="font-size:12px; font-weight:700; color:var(--neon-cyan);">Password Generator</span>
          <button class="btn btn-ghost" style="padding:4px 10px; font-size:11px;" onclick="generateStrongPassword()">Generate New</button>
        </div>
        <div class="gen-options">
          <label><input type="checkbox" id="gen-upper" checked> Uppercase (A-Z)</label>
          <label><input type="checkbox" id="gen-lower" checked> Lowercase (a-z)</label>
          <label><input type="checkbox" id="gen-nums" checked> Numbers (0-9)</label>
          <label><input type="checkbox" id="gen-syms" checked> Symbols (!@#$%)</label>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeCredModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveCredModal()">Save to Vault</button>
      </div>
    </div>
  </div>
  <script>
    let vault = [];
    let searchQuery = '';
    let editingId = null;
    const revealedMap = {};
    const autoHideTimers = {};

    function loadVault() {
      vault = [];
      if (window.aeonBridge && typeof window.aeonBridge.getPasswords === 'function') {
        const res = window.aeonBridge.getPasswords();
        if (Array.isArray(res)) vault = res;
        else if (typeof res === 'string') {
          try { vault = JSON.parse(res); } catch(e) { vault = []; }
        }
      } else if (window.aeonBridge && typeof window.aeonBridge.getSavedPasswords === 'function') {
        const res = window.aeonBridge.getSavedPasswords();
        if (Array.isArray(res)) vault = res;
        else if (typeof res === 'string') {
          try { vault = JSON.parse(res); } catch(e) { vault = []; }
        }
      } else {
        try {
          const cached = localStorage.getItem('aeon_vault_cache');
          vault = cached ? JSON.parse(cached) : [];
        } catch(e) {
          vault = [];
        }
      }
      renderVault();
    }

    function saveVaultCache() {
      try {
        localStorage.setItem('aeon_vault_cache', JSON.stringify(vault));
      } catch(e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const tm = document.getElementById('toast-msg');
      if (tm) tm.textContent = msg || 'Copied to clipboard';
      if (t) {
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2400);
      }
    }

    function onSearch() {
      searchQuery = (document.getElementById('vault-search')?.value || '').toLowerCase().trim();
      renderVault();
    }

    function copyText(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Copied ${label} to clipboard`);
      }).catch(() => {
        showToast(`Failed to copy ${label}`);
      });
    }

    function toggleReveal(id) {
      if (revealedMap[id]) {
        revealedMap[id] = false;
        if (autoHideTimers[id]) clearTimeout(autoHideTimers[id]);
      } else {
        revealedMap[id] = true;
        const item = vault.find(x => x.id === id);
        if (item && (!item.password || item.password === '••••••••••••••••' || item.password.includes('•'))) {
          if (window.aeonBridge && typeof window.aeonBridge.revealPassword === 'function') {
            const unmasked = window.aeonBridge.revealPassword(id, item.origin || '');
            if (unmasked && typeof unmasked === 'string') {
              item.password = unmasked;
            }
          }
        }
        if (autoHideTimers[id]) clearTimeout(autoHideTimers[id]);
        autoHideTimers[id] = setTimeout(() => {
          revealedMap[id] = false;
          renderVault();
        }, 10000); // 10 seconds auto-mask
      }
      renderVault();
    }
    function copyUsername(id) {
      const item = vault.find(x => x.id === id);
      if (!item) return;
      copyText(item.username || '', 'Username');
    }

    function copyPassword(id) {
      const item = vault.find(x => x.id === id);
      if (!item) return;
      if (window.aeonBridge && typeof window.aeonBridge.copyPassword === 'function') {
        window.aeonBridge.copyPassword(id);
        showToast('Copied Password to clipboard');
      } else {
        copyText(item.password || '', 'Password');
      }
    }

    function renderVault() {
      const container = document.getElementById('vault-container');
      if (!container) return;

      const filtered = vault.filter(item => {
        if (!searchQuery) return true;
        const o = (item.origin || '').toLowerCase();
        const u = (item.username || '').toLowerCase();
        return o.includes(searchQuery) || u.includes(searchQuery);
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:60px 20px; color:var(--text-dim);">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:12px; opacity:0.5;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <div style="font-size:15px; font-weight:600; color:#fff; margin-bottom:4px;">No Credentials Found</div>
            <div style="font-size:12px;">No matching accounts in your DPAPI encrypted vault.</div>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(item => {
        const isRevealed = Boolean(revealedMap[item.id]);
        const displayPass = isRevealed ? escapeHtml(item.password) : '••••••••••••••••';
        const healthClass = item.health === 'warning' ? 'warning' : 'strong';
        const healthLabel = item.health === 'warning' ? 'Weak' : 'Strong';

        html += `
          <div class="vault-row">
            <div class="site-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            </div>
            <div class="col-site">
              <div class="site-title">${escapeHtml(extractDomain(item.origin))}</div>
              <div class="site-url">${escapeHtml(item.origin)}</div>
            </div>
            <div class="col-user">
              <span class="user-text">${escapeHtml(item.username)}</span>
              <button class="icon-btn" title="Copy Username" onclick="copyUsername(${item.id})">
                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
            <div class="col-pass">
              <span class="pass-text ${isRevealed ? 'revealed' : ''}">${displayPass}</span>
              <button class="icon-btn" title="${isRevealed ? 'Hide (Auto in 10s)' : 'Reveal'}" onclick="toggleReveal(${item.id})">
                <svg viewBox="0 0 24 24">${isRevealed ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>' : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'}</svg>
              </button>
              <button class="icon-btn" title="Copy Password" onclick="copyPassword(${item.id})">
                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
            <div>
              <span class="badge-health ${healthClass}">${healthLabel}</span>
            </div>
            <div class="vault-row-actions" style="display:flex; gap:6px; margin-left:auto;">
              <button class="icon-btn" title="Edit" onclick="editCredential(${item.id})">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="icon-btn del" title="Delete" onclick="deleteCredential(${item.id})">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function extractDomain(url) {
      try {
        const u = new URL(url.startsWith('http') ? url : 'https://' + url);
        return u.hostname;
      } catch(e) {
        return url;
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    
    function toggleModalPassType() {
      const p = document.getElementById('cred-input-pass');
      if (p) {
        if (p.type === 'password') {
          p.type = 'text';
        } else {
          p.type = 'password';
        }
      }
    }
  
    function openAddModal() {
      editingId = null;
      document.getElementById('cred-modal-title').textContent = 'Add Credential';
      document.getElementById('cred-input-origin').value = '';
      document.getElementById('cred-input-user').value = '';
      document.getElementById('cred-input-pass').value = '';
      document.getElementById('cred-modal').classList.add('open');
    }

    function editCredential(id) {
      const item = vault.find(x => x.id === id);
      if (!item) return;
      editingId = id;
      document.getElementById('cred-modal-title').textContent = 'Edit Credential';
      document.getElementById('cred-input-origin').value = item.origin || '';
      document.getElementById('cred-input-user').value = item.username || '';
      document.getElementById('cred-input-pass').value = item.password || '';
      document.getElementById('cred-modal').classList.add('open');
    }

    function closeCredModal() {
      document.getElementById('cred-modal').classList.remove('open');
      editingId = null;
    }

    function generateStrongPassword() {
      const uppers = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const lowers = 'abcdefghijkmnopqrstuvwxyz';
      const nums = '23456789';
      const syms = '!@#$%^&*()_+-=[]{}';

      let pool = '';
      if (document.getElementById('gen-upper')?.checked) pool += uppers;
      if (document.getElementById('gen-lower')?.checked) pool += lowers;
      if (document.getElementById('gen-nums')?.checked) pool += nums;
      if (document.getElementById('gen-syms')?.checked) pool += syms;
      if (!pool) pool = uppers + lowers + nums + syms;

      let pass = '';
      for (let i = 0; i < 18; i++) {
        pass += pool.charAt(Math.floor(Math.random() * pool.length));
      }
      document.getElementById('cred-input-pass').value = pass;
    }

    function saveCredModal() {
      let origin = document.getElementById('cred-input-origin')?.value.trim() || 'https://';
      const user = document.getElementById('cred-input-user')?.value.trim() || '';
      const pass = document.getElementById('cred-input-pass')?.value || '';

      if (!origin.startsWith('http')) origin = 'https://' + origin;

      if (editingId) {
        const idx = vault.findIndex(x => x.id === editingId);
        if (idx !== -1) {
          vault[idx].origin = origin;
          vault[idx].username = user;
          vault[idx].password = pass;
        }
        if (window.aeonBridge && typeof window.aeonBridge.updatePassword === 'function') {
          window.aeonBridge.updatePassword(editingId, origin, user, pass);
        }
      } else {
        const newId = Date.now();
        vault.unshift({ id: newId, origin, username: user, password: pass, health: 'strong' });
        if (window.aeonBridge && typeof window.aeonBridge.savePassword === 'function') {
          window.aeonBridge.savePassword(origin, user, pass);
        }
      }

      saveVaultCache();
      renderVault();
      closeCredModal();
      showToast('Saved credential to DPAPI vault');
    }

    function deleteCredential(id) {
      vault = vault.filter(x => x.id !== id);
      delete revealedMap[id];
      if (window.aeonBridge && typeof window.aeonBridge.deletePassword === 'function') {
        window.aeonBridge.deletePassword(id);
      }
      saveVaultCache();
      renderVault();
      showToast('Deleted credential from vault');
    }

    function exportVault() {
      if (window.aeonBridge && typeof window.aeonBridge.exportPasswords === 'function') {
        window.aeonBridge.exportPasswords();
      } else {
        let csv = 'name,url,username,password\n';
        vault.forEach(item => {
          csv += `"${extractDomain(item.origin)}","${item.origin}","${item.username}","${item.password}"\n`;
        });
        const dataStr = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
        const a = document.createElement('a');
        a.setAttribute('href', dataStr);
        a.setAttribute('download', 'aeon_passwords.csv');
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast('Exported vault CSV');
      }
    }

    window.addEventListener('DOMContentLoaded', loadVault);
    loadVault();
  </script>
</body>
</html>
