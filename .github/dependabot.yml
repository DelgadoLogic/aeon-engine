version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/router"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-router:
        patterns:
          - "*"
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "cargo"
    directory: "/hive/aeon_hive_core"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-hive:
        patterns:
          - "*"
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
